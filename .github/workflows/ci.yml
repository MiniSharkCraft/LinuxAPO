name: Linux CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source and pinned upstreams
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake g++ ninja-build pkg-config \
            libsndfile1-dev libpipewire-0.3-dev libfftw3-dev \
            liblilv-dev lv2-dev qt6-base-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source and pinned upstreams
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake g++ ninja-build pkg-config \
            libsndfile1-dev libpipewire-0.3-dev libfftw3-dev \
            liblilv-dev lv2-dev qt6-base-dev

      - name: Configure ASan/UBSan
        run: >-
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DSKYAPO_SANITIZERS=ON

      - name: Build ASan/UBSan
        run: cmake --build build-asan --parallel 2

      - name: Test ASan/UBSan
        run: ctest --test-dir build-asan --output-on-failure

  arch-package:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Check out source and pinned upstreams
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cmake git libsndfile pipewire fftw lilv lv2 qt6-base pkgconf

      - name: Build and test Arch packages
        run: |
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE/packaging"
          su builder -s /bin/bash -c 'makepkg --noconfirm --nodeps --clean'
