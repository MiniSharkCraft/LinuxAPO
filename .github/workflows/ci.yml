name: Linux build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizers: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libsndfile1-dev libpipewire-0.3-dev qt6-base-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DSKYAPO_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
