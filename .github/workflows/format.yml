name: C++ formatting

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source and history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install pinned clang-format
        run: |
          format_venv="$RUNNER_TEMP/skyapo-clang-format-18.1.3"
          python3 -m venv "$format_venv"
          "$format_venv/bin/python" -m pip install \
            --disable-pip-version-check clang-format==18.1.3
          echo "CLANG_FORMAT=$format_venv/bin/clang-format" >> "$GITHUB_ENV"
          echo "CLANG_FORMAT_DIFF=$format_venv/bin/clang-format-diff.py" >> "$GITHUB_ENV"
          echo "CLANG_FORMAT_PYTHON=$format_venv/bin/python" >> "$GITHUB_ENV"
          "$format_venv/bin/clang-format" --version

      - name: Check changed SkyAPO C++ files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base_sha="$BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          scripts/check-format.sh "$base_sha"
